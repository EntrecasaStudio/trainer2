function countExercises(routines) {
  const c = {};
  routines.forEach(r => r.circuits.forEach(([,exs]) => exs.forEach(e => { c[e] = (c[e]||0)+1; })));
  return c;
}

function findRepeatsInRoutine(routine) {
  const seen = {};
  routine.circuits.forEach(([,exs]) => exs.forEach(e => { seen[e] = (seen[e]||0)+1; }));
  const reps = {};
  for (const [k,v] of Object.entries(seen)) if (v > 1) reps[k] = v;
  return reps;
}

function renderTable(routines, title) {
  const freq = countExercises(routines);
  const groups = routines[0].circuits.map(c => c[0]);
  let html = '<h2>' + title + '</h2>';
  html += '<div class="legend"><span class="orange">■ Naranja</span> = ejercicio repetido 3+ veces en el grupo | <span class="blue">■ Azul</span> = repetido 2 veces | <span class="red">■ Rojo subrayado</span> = repetido dentro de la misma rutina</div>';
  html += '<table><tr><th>Circuito</th>';
  routines.forEach(r => { html += '<th>' + r.name.split(' ')[2] + '</th>'; });
  html += '</tr>';
  groups.forEach((g, gi) => {
    html += '<tr><td>' + g + '</td>';
    routines.forEach(r => {
      const exs = r.circuits[gi][1];
      const repeats = findRepeatsInRoutine(r);
      html += '<td>' + exs.map(e => {
        const f = freq[e]||0;
        const isRepeat = repeats[e];
        let cls = '';
        if (isRepeat) cls = 'repeat';
        else if (f >= 3) cls = 'freq-3';
        else if (f >= 2) cls = 'freq-2';
        return cls ? '<span class="' + cls + '">' + e + '</span>' : e;
      }).join('<br>') + '</td>';
    });
    html += '</tr>';
  });
  html += '</table>';

  const sorted = Object.entries(freq).filter(([,v]) => v >= 2).sort((a,b) => b[1]-a[1]);
  if (sorted.length) {
    html += '<h3>Frecuencia de ejercicios</h3>';
    html += '<table class="freq-table"><tr><th>Ejercicio</th><th>Veces</th><th>Frecuencia</th></tr>';
    sorted.forEach(([e,c]) => {
      const hi = c >= 4 ? ' class="hi"' : '';
      html += '<tr><td' + hi + '>' + e + '</td><td>' + c + '</td><td>' + '█'.repeat(c) + '</td></tr>';
    });
    html += '</table>';
  }
  return html;
}

function renderSimilarTable() {
  let html = '<h2>Ejercicios con nombres similares (posibles duplicados)</h2>';
  html += '<table class="similar-table"><tr><th>Ejercicio 1</th><th>Ejercicio 2</th><th>Relación</th></tr>';
  SIMILAR_PAIRS.forEach(([a,b,r]) => {
    html += '<tr><td>' + a + '</td><td>' + b + '</td><td>' + r + '</td></tr>';
  });
  html += '</table>';
  return html;
}
