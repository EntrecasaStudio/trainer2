<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1A1A1A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Entrecasa Trainer</title>
  <script>
    // Force SW update — nuke old cache-first SW
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistration().then(reg => {
        if (reg) reg.update();
      });
    }
  </script>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="images/icon-192.png">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/light/style.css">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
  <link rel="stylesheet" href="https://use.typekit.net/xnu3moa.css">
  <link rel="stylesheet" href="src/styles/tokens.css">
  <link rel="stylesheet" href="src/styles/components.css">
  <link rel="stylesheet" href="src/styles/views.css">
  <link rel="stylesheet" href="src/styles/workout.css">
</head>
<body>
  <div id="splash" style="position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#1A1A1A;transition:opacity 0.4s ease,transform 0.4s ease,filter 0.4s ease;">
    <style>
      @keyframes splash-icon-enter { from { opacity:0; transform:scale(0); } to { opacity:1; transform:scale(1); } }
      @keyframes splash-text-enter { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
      .splash-neumorph {
        width:120px; height:120px; border-radius:32px;
        background:#222;
        box-shadow: 8px 8px 20px rgba(0,0,0,0.6), -6px -6px 16px rgba(60,60,60,0.15), inset 0 1px 0 rgba(255,255,255,0.04);
        display:flex; align-items:center; justify-content:center;
      }
    </style>
    <div style="position:relative;opacity:0;animation:splash-icon-enter 600ms cubic-bezier(0.34,1.56,0.64,1) forwards;">
      <div class="splash-neumorph">
        <img src="images/kettlebell-3d.png" alt="" width="120" height="120" style="display:block;pointer-events:none;">
      </div>
    </div>
    <div style="margin-top:20px;text-align:center;opacity:0;animation:splash-text-enter 400ms ease-out 300ms forwards;">
      <div style="font-family:system-ui,-apple-system,sans-serif;font-size:0.65rem;font-weight:400;color:rgba(245,240,232,0.5);letter-spacing:4px;text-transform:uppercase;">ENTRECASA</div>
      <div style="font-family:system-ui,-apple-system,sans-serif;font-size:1.8rem;font-weight:800;color:#F5F0E8;letter-spacing:5px;text-transform:uppercase;margin-top:2px;">TRAINER</div>
    </div>
    <div style="width:100px;height:2px;margin-top:14px;border-radius:2px;background:rgba(255,255,255,0.06);overflow:hidden;opacity:0;animation:splash-text-enter 300ms ease-out 500ms forwards;">
      <div id="splash-progress-bar" style="height:100%;width:0%;background:linear-gradient(90deg,#ffcd00,#ffb300);border-radius:2px;transition:width 0.3s ease;"></div>
    </div>
  </div>

  <div id="app" class="app hidden">
    <div id="avatar-menu" class="avatar-menu"></div>
    <main id="view-container"></main>
    <nav id="nav" class="nav"></nav>
  </div>

  <div id="toast-container" class="toast-container"></div>
  <div id="modal-overlay" class="modal-overlay hidden"></div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
